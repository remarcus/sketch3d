[package]
name = "sketch3d"
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Sketch3D: an open-source, tablet-first 3D sketching app"
keywords = ["3d", "sketching", "tablet", "feather-3d", "grease-pencil"]

[dependencies]
lyon_tessellation = { version = "=1.0.23", optional = true }
eframe = { version = "0.31.1", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
glam = { version = "0.30", features = ["serde", "bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
raw-window-handle = "0.6"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
ureq = { version = "3.5.1", features = ["json"] }

[features]
lyon-evaluation = ["dep:lyon_tessellation"]

[[example]]
name = "lyon_evaluation"
required-features = ["lyon-evaluation"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_Pointer", "Win32_UI_Input", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["xinput"] }
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-protocols = { version = "0.32.13", features = ["client"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSEvent", "NSView", "NSWindow", "block2", "objc2-core-foundation"] }

[dev-dependencies]
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
