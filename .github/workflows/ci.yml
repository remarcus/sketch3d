name: Rust checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libvulkan-dev mesa-vulkan-drivers libdbus-1-dev xvfb
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Run normalized verifier suite
        shell: pwsh
        run: ./scripts/run_verification.ps1 -OutputDirectory verification/normalized
      - name: Upload normalized verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results-${{ matrix.os }}
          path: verification/normalized
          if-no-files-found: ignore
