name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml
        shell: pwsh
        run: |
          $manifest = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version = "([^"]+)"').Groups[1].Value
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($tagVersion -ne $version) {
            throw "Release tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libvulkan-dev libdbus-1-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ($env:RUNNER_ARCH -eq 'X64') { 'x86_64' } else { 'aarch64' }
          $stage = Join-Path $env:RUNNER_TEMP 'sketch3d-release'
          New-Item -ItemType Directory -Force -Path $stage, 'dist' | Out-Null
          Copy-Item 'target/release/sketch3d.exe', 'README.md', 'LICENSE' -Destination $stage
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'scripts'), (Join-Path $stage 'src') | Out-Null
          Copy-Item 'scripts/run_verification.ps1' -Destination (Join-Path $stage 'scripts')
          Copy-Item 'src/animation_check.rs', 'src/still_export_check.rs', 'src/glb_texture_roundtrip_check.rs' -Destination (Join-Path $stage 'src')
          $archive = "Sketch3D-$($env:GITHUB_REF_NAME)-windows-$arch.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path 'dist' $archive)

      - name: Package Unix release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=x86_64 ;;
            ARM64) arch=aarch64 ;;
            *) echo "Unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          mkdir -p dist/package
          cp "target/release/sketch3d" README.md LICENSE dist/package/
          mkdir -p dist/package/scripts dist/package/src
          cp scripts/run_verification.ps1 dist/package/scripts/
          cp src/animation_check.rs src/still_export_check.rs src/glb_texture_roundtrip_check.rs dist/package/src/
          if [[ "$PLATFORM" == "macos" ]]; then
            app="dist/package/Sketch3D.app/Contents"
            mkdir -p "$app/MacOS" "$app/Resources/verification-support/scripts" "$app/Resources/verification-support/src"
            cp target/release/sketch3d "$app/MacOS/sketch3d"
            cp assets/icons/sketch3d.icns "$app/Resources/sketch3d.icns"
            cp scripts/run_verification.ps1 "$app/Resources/verification-support/scripts/"
            cp src/animation_check.rs src/still_export_check.rs src/glb_texture_roundtrip_check.rs "$app/Resources/verification-support/src/"
            cat > "$app/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleName</key><string>Sketch3D</string>
          <key>CFBundleDisplayName</key><string>Sketch3D</string>
          <key>CFBundleIdentifier</key><string>io.github.remarcus.sketch3d</string>
          <key>CFBundleExecutable</key><string>sketch3d</string>
          <key>CFBundleIconFile</key><string>sketch3d.icns</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
          <key>CFBundleVersion</key><string>${GITHUB_REF_NAME#v}</string>
          <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          else
            cp assets/icons/sketch3d.png dist/package/sketch3d.png
          fi
          archive="Sketch3D-${GITHUB_REF_NAME}-${PLATFORM}-${arch}.tar.gz"
          tar -czf "dist/$archive" -C dist/package .
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Create SHA-256 checksums
        working-directory: dist
        run: sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      # Avoid appending a second generated notes body when a release run is retried.
      - name: Check whether release notes already exist
        id: release_notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' 2>/dev/null || true)"
          if [[ -n "$body" ]]; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: ${{ steps.release_notes.outputs.generate }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
